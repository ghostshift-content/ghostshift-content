<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="GhostShift. Jay Patel. Penetration tester. OSCP, eWPTXv2, Azure Security Engineer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1040" cy="60" r="190" fill="#7c6cff" fill-opacity="0.08"/>
  <circle cx="1120" cy="260" r="120" fill="#22d3ee" fill-opacity="0.07"/>

  <!-- terminal card -->
  <g transform="translate(60,54)">
    <rect width="640" height="192" rx="12" fill="#0a0f1e" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="38" cy="20" r="5" fill="#febc2e"/><circle cx="56" cy="20" r="5" fill="#28c840"/>
    <text x="24" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b95b3">$ whoami</text>
    <text x="24" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#ffffff" filter="url(#glow)">ghostshift</text>
    <text x="24" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b95b3">$ cat role.txt</text>
    <text x="24" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#c7d2fe">Penetration tester · web · cloud · AD · mobile</text>
    <rect x="24" y="176" width="11" height="3" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right column -->
  <g transform="translate(760,70)" font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="13" letter-spacing="3" fill="#8b95b3">JAY PATEL</text>
    <text x="0" y="40" font-size="30" font-weight="700" fill="#ffffff">Grew up breaking things</text>
    <text x="0" y="74" font-size="30" font-weight="700" fill="url(#accent)">to understand them.</text>
    <g transform="translate(0,104)" font-size="12" font-weight="600">
      <rect width="72" height="26" rx="13" fill="#7c6cff" fill-opacity="0.18" stroke="#7c6cff" stroke-opacity="0.5"/><text x="36" y="17" text-anchor="middle" fill="#c7d2fe">OSCP</text>
      <rect x="82" width="98" height="26" rx="13" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/><text x="131" y="17" text-anchor="middle" fill="#a5f3fc">eWPTXv2</text>
      <rect x="190" width="112" height="26" rx="13" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.5"/><text x="246" y="17" text-anchor="middle" fill="#bae6fd">Azure AZ-500</text>
    </g>
    <text x="0" y="168" font-size="13" fill="#8b95b3">Melbourne · 7+ years offensive security · 100+ engagements</text>
  </g>
</svg>
